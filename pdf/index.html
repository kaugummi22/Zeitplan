    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
      // Doppelklick auf eine PDF-Datei (installierte App am PC): Datei übernehmen und öffnen
      if ("launchQueue" in window) launchQueue.setConsumer(async function (p) {
        if (!p.files || !p.files.length) return;
        const f = await p.files[0].getFile();
        const url = new URL("_open/" + Date.now() + "/" + encodeURIComponent(f.name), location.href).href;
        const c = await caches.open("pdf-open");
        for (const k of await c.keys()) await c.delete(k);
        await c.put(url, new Response(f, { headers: { "Content-Type": "application/pdf" } }));
        location.replace("./?file=" + encodeURIComponent(url));
      });
    </script>
    
<script type="module">

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
